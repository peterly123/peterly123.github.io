<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peter Ly – Photography</title>
<meta name="description" content="Photography by Peter Ly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf8;
    --text: #1c1c1c;
    --muted: #757570;
    --line: #e4e4df;
    --gap: 14px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 400;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  header {
    max-width: 1400px;
    margin: 0 auto;
    padding: 48px 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    flex-wrap: wrap;
  }
  .name { font-size: 1.5rem; font-weight: 300; letter-spacing: 0.01em; margin: 0; }
  nav { display: flex; gap: 24px; font-size: 0.95rem; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a:hover { color: var(--text); }

  main { max-width: 1400px; margin: 0 auto; padding: 0 24px 80px; }

  .gallery { columns: 3 320px; column-gap: var(--gap); }
  .gallery button {
    display: block;
    width: 100%;
    margin: 0 0 var(--gap);
    padding: 0;
    border: 0;
    background: var(--line);
    cursor: zoom-in;
    break-inside: avoid;
  }
  .gallery img { display: block; width: 100%; height: auto; }

  .empty {
    border: 1px dashed var(--line);
    padding: 48px 24px;
    max-width: 560px;
  }
  .empty p { margin: 0 0 8px; }
  .empty p:last-child { color: var(--muted); margin: 0; }

  .about { max-width: 520px; padding-top: 72px; }
  .about h2 { font-size: 1.1rem; font-weight: 500; margin: 0 0 12px; }
  .about p { margin: 0 0 12px; color: var(--muted); }

  footer { max-width: 1400px; margin: 0 auto; padding: 24px; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--line); }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(250, 250, 248, 0.97);
    display: none;
    align-items: center; justify-content: center;
    padding: 56px 24px;
    z-index: 10;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb-btn {
    position: absolute;
    background: none; border: 0;
    font: inherit; font-size: 1rem;
    color: var(--text);
    cursor: pointer;
    padding: 12px 16px;
  }
  .lb-close { top: 12px; right: 12px; }
  .lb-prev { left: 4px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 4px; top: 50%; transform: translateY(-50%); }
  .lb-caption { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 0.9rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header>
  <h1 class="name">Peter Ly</h1>
  <nav aria-label="Main">
    <a href="#work">Work</a>
    <a href="#about">About</a>
  </nav>
</header>

<main>
  <section id="work" aria-label="Photos">
    <div class="gallery" id="gallery"></div>
  </section>

  <section id="about" class="about">
    <h2>About</h2>
    <p>I’m Peter, a photographer based in Canada. Write a sentence or two here about what you shoot and what draws you to it.</p>
    <p><a href="mailto:you@example.com">you@example.com</a></p>
  </section>
</main>

<footer>© <span id="year"></span> Peter Ly</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">Close</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous photo">Prev</button>
  <img id="lbImg" alt="">
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo">Next</button>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<script>
  /* ADD YOUR PHOTOS HERE
     1. Put the image files in the "photos" folder.
     2. Add one line per photo below: file name, a short description (alt), and an optional caption.
     Photos show in the order listed. */
  const PHOTOS = [
    // { src: "photos/example-1.jpg", alt: "Describe the photo", caption: "Toronto, 2026" },
  ];

  const gallery = document.getElementById("gallery");
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lbImg");
  const lbCaption = document.getElementById("lbCaption");
  let current = 0;
  let opener = null;

  document.getElementById("year").textContent = new Date().getFullYear();

  if (PHOTOS.length === 0) {
    gallery.outerHTML =
      '<div class="empty"><p>No photos yet.</p>' +
      '<p>Add image files to the photos folder, then list them in the PHOTOS section of index.html.</p></div>';
  } else {
    PHOTOS.forEach((p, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", "View photo " + (i + 1) + (p.alt ? ": " + p.alt : ""));
      const img = document.createElement("img");
      img.src = p.src;
      img.alt = p.alt || "";
      img.loading = "lazy";
      b.appendChild(img);
      b.addEventListener("click", () => open(i, b));
      gallery.appendChild(b);
    });
  }

  function show(i) {
    current = (i + PHOTOS.length) % PHOTOS.length;
    const p = PHOTOS[current];
    lbImg.src = p.src;
    lbImg.alt = p.alt || "";
    lbCaption.textContent = p.caption || "";
  }
  function open(i, el) {
    opener = el;
    show(i);
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
    document.getElementById("lbClose").focus();
  }
  function close() {
    lb.classList.remove("open");
    document.body.style.overflow = "";
    if (opener) opener.focus();
  }

  document.getElementById("lbClose").addEventListener("click", close);
  document.getElementById("lbPrev").addEventListener("click", () => show(current - 1));
  document.getElementById("lbNext").addEventListener("click", () => show(current + 1));
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(current - 1);
    if (e.key === "ArrowRight") show(current + 1);
  });
</script>
</body>
</html>
